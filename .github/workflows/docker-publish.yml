name: Build and Publish Multi-Arch Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  schedule:
    # Run every Sunday at 04:00 UTC to verify upstream Google updates
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  IMAGE_NAME: antigravity-cli
  DOCKERHUB_REPO: hovee/antigravity-cli
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/antigravity-cli

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if credentials provided)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine target container images
        id: images
        run: |
          IMAGES="${{ env.GHCR_REPO }}"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGES="${IMAGES},${{ env.DOCKERHUB_REPO }}"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern=weekly
            type=sha,format=short

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: "Headless Google Antigravity CLI autonomous AI coding agent for Unraid and Docker hosts."
          readme-filepath: ./README.md
          enable-url-completion: true

